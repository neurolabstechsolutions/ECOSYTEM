<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="neurolabsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base (Deep Obsidian) -->
  <rect width="500" height="500" rx="110" fill="#090D16" />

  <!-- Outer Neural Ring -->
  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#neurolabsGrad)" stroke-width="6" opacity="0.3" stroke-dasharray="16 10" />

  <!-- Glow Effect Behind Brain Nodes -->
  <circle cx="250" cy="250" r="120" fill="url(#neurolabsGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- Neural Hexagon Architecture Core -->
  <polygon points="250,110 370,180 370,320 250,390 130,320 130,180" fill="none" stroke="url(#neurolabsGrad)" stroke-width="8" stroke-linejoin="round" />

  <!-- Central Synaptic Node Lines (Connecting Innovation) -->
  <line x1="250" y1="110" x2="250" y2="250" stroke="#06B6D4" stroke-width="4" opacity="0.8" />
  <line x1="370" y1="180" x2="250" y2="250" stroke="#3B82F6" stroke-width="4" opacity="0.8" />
  <line x1="370" y1="320" x2="250" y2="250" stroke="#8B5CF6" stroke-width="4" opacity="0.8" />
  <line x1="250" y1="390" x2="250" y2="250" stroke="#10B981" stroke-width="4" opacity="0.8" />
  <line x1="130" y1="320" x2="250" y2="250" stroke="#06B6D4" stroke-width="4" opacity="0.8" />
  <line x1="130" y1="180" x2="250" y2="250" stroke="#3B82F6" stroke-width="4" opacity="0.8" />

  <!-- Neural Vertex Nodes -->
  <circle cx="250" cy="110" r="14" fill="#06B6D4" />
  <circle cx="370" cy="180" r="14" fill="#3B82F6" />
  <circle cx="370" cy="320" r="14" fill="#8B5CF6" />
  <circle cx="250" cy="390" r="14" fill="#10B981" />
  <circle cx="130" cy="320" r="14" fill="#06B6D4" />
  <circle cx="130" cy="180" r="14" fill="#3B82F6" />

  <!-- Central Quantum Neural Core (Pulse of Intelligence) -->
  <circle cx="250" cy="250" r="32" fill="url(#glowGrad)" filter="url(#glow)" />
  <circle cx="250" cy="250" r="22" fill="#FFFFFF" />

  <!-- Inner Sparkle Core -->
  <polygon points="250,234 254,246 266,250 254,254 250,266 246,254 234,250 246,246" fill="#090D16" />
</svg>
